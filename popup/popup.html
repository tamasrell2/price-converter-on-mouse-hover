<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="settingsTitle">Price converter settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 data-i18n="heading">Price Converter</h1>
  </header>

  <label class="field">
    <span class="label" data-i18n="targetLabel">Show prices in</span>
    <select id="target"></select>
  </label>

  <label class="field">
    <span class="label" data-i18n="fallbackLabel">If a price is already in that currency</span>
    <select id="fallback"></select>
  </label>

  <div class="status">
    <span id="status">…</span>
    <button id="refresh" type="button" class="link" data-i18n="refresh">Refresh</button>
  </div>
  <div class="error" id="error" hidden></div>

  <p class="hint" data-i18n="hint">Hover over a price on any website to see it in the currency above.</p>

  <a class="support" href="https://ko-fi.com/R5C12AJWQ8" target="_blank" rel="noopener">
    <svg class="cup" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 8h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z" fill="#fff"/>
      <path d="M16 9.5h1.5a2.75 2.75 0 0 1 0 5.5H16" fill="none" stroke="#fff" stroke-width="2"/>
      <path d="M10 15.2s-3-1.9-3-3.7a1.5 1.5 0 0 1 3-.4 1.5 1.5 0 0 1 3 .4c0 1.8-3 3.7-3 3.7z" fill="#2563EB"/>
    </svg>
    <span data-i18n="supportLink">Support me on Ko-fi</span>
  </a>

  <script src="../src/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
